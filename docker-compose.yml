name: nurtricenter-ms5

services:
  api:
    image: aguerreroc/nurtricenter-ms5:0.1.0
    container_name: nurtricenter-ms5-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
networks:
  backend:
